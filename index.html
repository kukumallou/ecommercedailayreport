<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商中心 · 日报总览</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-page:#faf9f5;--bg-card:#ffffff;--bg-card2:#f3f1eb;--bg-hover:#eeece6;
  --border:rgba(0,0,0,0.07);--border-med:rgba(0,0,0,0.13);
  --text-primary:#1e1c18;--text-secondary:#6b6760;--text-muted:#a09d97;
  --blue:#2f7de1;--blue-dim:rgba(47,125,225,0.10);
  --up-bg:rgba(200,50,50,0.09);--up-text:#c03030;
  --dn-bg:rgba(26,158,110,0.10);--dn-text:#1a9e6e;
  --radius-sm:6px;--radius-md:10px;
  --dept-a:#2f7de1;--dept-b:#1a9e6e;--dept-c:#c47f10;
}
body{background:var(--bg-page);color:var(--text-primary);font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.6;min-height:100vh}
.page{max-width:980px;margin:0 auto;padding:28px 20px 56px}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;flex-wrap:wrap;gap:12px}
.header h1{font-size:20px;font-weight:600;letter-spacing:.01em}
.header .subtitle{font-size:12px;color:var(--text-muted);margin-top:3px}
.section-title{font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;margin:26px 0 10px}
.divider{border:none;border-top:1px solid var(--border);margin:24px 0 0}

/* ── 核心指标：两行各4格 ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
@media(max-width:700px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi-cell{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 14px 10px;box-shadow:0 1px 4px rgba(0,0,0,0.04);transition:border-color .18s;position:relative;min-height:88px;display:flex;flex-direction:column;justify-content:space-between}
.kpi-cell:hover{border-color:var(--border-med)}
.kpi-cell .lbl{font-size:11px;color:var(--text-muted);font-weight:500;margin-bottom:4px}
.kpi-cell .num{font-size:20px;font-weight:700;color:var(--text-primary)}
.kpi-cell .sub-num{font-size:12px;color:var(--text-secondary);margin-top:2px}
.kpi-cell .qoq{font-size:11px;font-weight:500;text-align:right;margin-top:4px}
.qoq-up{color:var(--up-text)}.qoq-dn{color:var(--dn-text)}.qoq-flat{color:var(--text-muted)}

/* 目标卡片特殊样式 */
.kpi-cell.target-cell .num{font-size:16px;font-weight:700}
.kpi-cell.target-cell .target-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:5px}
.kpi-cell.target-cell .target-label{font-size:11px;color:var(--text-muted)}
.kpi-cell.target-cell .target-val{font-size:14px;font-weight:600;color:var(--text-primary)}
.kpi-cell.target-cell .target-bar-outer{height:5px;background:var(--bg-card2);border-radius:3px;margin-top:6px;overflow:hidden}
.kpi-cell.target-cell .target-bar-inner{height:100%;border-radius:3px;background:var(--blue);transition:width .5s ease}

/* 趋势折线图 */
.trend-wrap{display:flex;gap:12px;align-items:flex-start}
.trend-dept-btns{display:flex;flex-direction:column;gap:6px;flex-shrink:0;padding-top:2px}
.dept-btn{padding:5px 14px;font-size:12px;border:1px solid var(--border-med);border-radius:var(--radius-sm);cursor:pointer;background:var(--bg-card);color:var(--text-secondary);transition:all .18s;font-family:inherit;white-space:nowrap}
.dept-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.dept-btn.active-all{border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}
.dept-btn.active-a{border-color:var(--dept-a);color:var(--dept-a);background:rgba(47,125,225,0.10)}
.dept-btn.active-b{border-color:var(--dept-b);color:var(--dept-b);background:rgba(26,158,110,0.10)}
.dept-btn.active-c{border-color:var(--dept-c);color:var(--dept-c);background:rgba(196,127,16,0.10)}
.trend-main{flex:1;min-width:0}
.trend-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.ctrl-wrap{position:relative;display:inline-block}
.ctrl-wrap::after{content:'▾';position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;font-size:11px}
.ctrl-select{font-size:13px;padding:5px 26px 5px 10px;border:1px solid var(--border-med);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text-primary);cursor:pointer;outline:none;appearance:none;font-family:inherit}
.t-btn{padding:4px 13px;font-size:12px;border:1px solid var(--border-med);border-radius:var(--radius-sm);cursor:pointer;background:var(--bg-card);color:var(--text-secondary);transition:all .18s;font-family:inherit}
.t-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.t-btn.active{border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;font-size:12px;color:var(--text-secondary)}
.chart-wrap{position:relative;width:100%;height:240px}
.infl-chart-outer{overflow-x:auto;width:100%;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-card);box-shadow:0 1px 4px rgba(0,0,0,0.04);padding:16px 16px 12px 0;position:relative}
.infl-chart-axis{position:sticky;left:0;top:0;float:left;width:76px;height:320px;z-index:4;background:var(--bg-card);pointer-events:none}
.infl-axis-label{position:absolute;right:14px;transform:translateY(-50%);font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.infl-axis-title{position:absolute;left:2px;top:4px;font-size:10px;color:var(--text-muted);writing-mode:vertical-rl;letter-spacing:.04em}
.infl-chart-inner{position:relative;height:320px;min-width:900px;margin-left:76px}

/* 达人区表格 */
.infl-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.infl-table{border-collapse:collapse;font-size:12px;white-space:nowrap;min-width:100%}
.infl-table th{background:var(--bg-card2);color:var(--text-muted);font-size:11px;font-weight:600;padding:8px 12px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);text-align:left;position:sticky;top:0;z-index:2}
.infl-table th.sticky-col{position:sticky;left:0;z-index:3;background:var(--bg-card2)}
.infl-table td{padding:7px 12px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);color:var(--text-primary);background:var(--bg-card);vertical-align:middle}
.infl-table td.sticky-col{position:sticky;left:0;z-index:1;background:var(--bg-card);font-weight:500}
.infl-table tr:last-child td{border-bottom:none}
.infl-table td:last-child,.infl-table th:last-child{border-right:none}
.dept-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;background:var(--bg-card2);color:var(--text-secondary)}
.dept-badge.a{background:rgba(47,125,225,0.10);color:var(--dept-a)}
.dept-badge.b{background:rgba(26,158,110,0.10);color:var(--dept-b)}
.dept-badge.c{background:rgba(196,127,16,0.10);color:var(--dept-c)}
.date-col-recent{background:rgba(47,125,225,0.04)!important}
.gmv-val{font-variant-numeric:tabular-nums}
.gmv-zero{color:var(--text-muted)}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-med);border-radius:3px}
</style>
</head>

<div class="page">

<div class="header">
  <div>
    <h1>电商中心 · 日报总览</h1>
    <div class="subtitle" id="reportDate"></div>
  </div>
</div>

<!-- 核心指标 -->
<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:26px;margin-bottom:10px">
  <div class="section-title" style="margin:0">核心指标</div>
  <div id="kpiDeptBtns" style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="dept-btn active-all" data-dept="all">总部门</button>
    <button class="dept-btn" data-dept="A">大药房</button>
    <button class="dept-btn" data-dept="B">药品电商</button>
    <button class="dept-btn" data-dept="C">大健康</button>
  </div>
</div>
<!-- 第一行：GMV -->
<div class="kpi-grid" id="kpiRowGMV"></div>
<!-- 第二行：投入 -->
<div class="kpi-grid" id="kpiRowSpend"></div>

<hr class="divider">
<div class="section-title">趋势折线图</div>
<div class="trend-wrap">
  <div class="trend-dept-btns" id="trendDeptBtns">
    <button class="dept-btn active-all" data-dept="all">总部门</button>
    <button class="dept-btn" data-dept="A">大药房</button>
    <button class="dept-btn" data-dept="B">药品电商</button>
    <button class="dept-btn" data-dept="C">大健康</button>
  </div>
  <div class="trend-main">
    <div class="trend-controls">
      <div class="ctrl-wrap">
        <select class="ctrl-select" id="trendRangeSelect">
          <option value="7">近 7 天</option>
          <option value="30">近 30 天</option>
          <option value="90">近 90 天</option>
          <option value="365">近 365 天</option>
        </select>
      </div>
      <div id="trendMetricBtns" style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="t-btn active" data-metric="gmv">GMV</button>
        <button class="t-btn" data-metric="roi">ROI</button>
        <button class="t-btn" data-metric="spend">投入量</button>
      </div>
    </div>
    <div class="legend-row" id="trendLegend"></div>
    <div class="chart-wrap">
      <canvas id="trendChart" role="img" aria-label="电商中心趋势折线图">GMV/ROI/投入量折线趋势。</canvas>
    </div>
  </div>
</div>

<hr class="divider">
<div class="section-title">达人区</div>
<div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">横坐标为日期，纵坐标为 GMV；如当天存在达人合作事件，会在折线端点上高亮标记</div>
<div id="inflRangeBtns" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
  <button class="t-btn active" data-days="7">近7日</button>
  <button class="t-btn" data-days="30">近30日</button>
  <button class="t-btn" data-days="90">近90日</button>
  <button class="t-btn" data-days="365">近365日</button>
</div>
<div id="inflChartOuter" class="infl-chart-outer">
  <div id="inflYAxis" class="infl-chart-axis" aria-hidden="true"></div>
  <div id="inflChartInner" class="infl-chart-inner">
    <canvas id="inflChart" role="img" aria-label="达人区时间趋势与事件标记图"></canvas>
  </div>
</div>

</div>

/* 趋势数据预处理：自动计算 ROI 数组 */
const TREND = {};
const DEPTS    = ['大药方','药品电商','大健康'];
const DEPT_KEY = {'大药方':'A','药品电商':'B','大健康':'C'};
const DEPT_LABEL = {'大药方':'大药房','药品电商':'药品电商','大健康':'大健康'};
const D_COLOR  = {'大药方':'#2f7de1','药品电商':'#1a9e6e','大健康':'#c47f10'};
const D_DASH   = {'大药方':[],'药品电商':[6,3],'大健康':[3,3]};
DEPTS.forEach(k => {
  TREND[k] = {};
  ['近7日','近30日','近90日','近365日'].forEach(rk => {
    const g = (TREND_RAW[k][rk+'GMV']  ||[]).map(Number);
    const s = (TREND_RAW[k][rk+'投入'] ||[]).map(Number);
    TREND[k][rk] = { GMV:g, '投入量':s, ROI:g.map((v,i)=>s[i]>0?v/s[i]:0) };
  });
});

const pad    = n => String(n).padStart(2,'0');
const fmtAmt = n => `¥${(+n).toFixed(1)}万`;
const fmtAxisAmt = n => {
  const rounded = Math.round((+n) * 10) / 10;
  return `¥${Number.isInteger(rounded) ? rounded.toFixed(0) : rounded.toFixed(1)}万`;
};
const fmtROI = n => (+n).toFixed(2);
const METRIC_FMT = {
  gmv:  { label:'GMV（万）',   yFmt:v=>fmtAxisAmt(v), dataKey:'GMV'   },
  roi:  { label:'ROI',         yFmt:v=>v.toFixed(2),  dataKey:'ROI'   },
  spend:{ label:'投入量（万）', yFmt:v=>fmtAxisAmt(v), dataKey:'投入量' },
};

let trendChart=null, inflChart=null;
let trendDept='all', trendDays=7, trendMetric='gmv';
let inflDays=7;

const [Y,M,Dy] = REPORT_DATE.split('-');
document.getElementById('reportDate').textContent = `${Y}年${M}月${Dy}日（数据截至当日）`;

function qoqHtml(val) {
  if (!val) return `<span class="qoq-flat">环比 — </span>`;
  const pos = val > 0;
  return `<span class="${pos?'qoq-up':'qoq-dn'}">环比 ${pos?'↑':'↓'} ${Math.abs(val).toFixed(1)}%</span>`;
}

let kpiDept = 'all';

function getKpiDepts() {
  if (kpiDept === 'all') return DEPTS;
  return [DEPTS.find(k => DEPT_KEY[k] === kpiDept)].filter(Boolean);
}

function renderKPIGMV() {
  const depts = getKpiDepts();
  const isSingle = depts.length === 1;
  const periods = ['今日','近7日','近30日'];
  const labels  = ['今日 GMV','近 7 日 GMV','近 30 日 GMV'];

  const cells = periods.map((p, i) => {
    const total  = depts.reduce((s,k) => s + (+GMV[k][p]||0), 0);
    const yoyAvg = depts.reduce((s,k) => s + (+GMV_YOY[k][p]||0), 0) / depts.length;
    return `<div class="kpi-cell">
      <div><div class="lbl">${labels[i]}</div><div class="num">${fmtAmt(total)}</div></div>
      <div class="qoq">${qoqHtml(yoyAvg)}</div>
    </div>`;
  });

  const tT = depts.reduce((s,k) => s+(+TARGET_GMV[k].目标||0), 0);
  const tA = depts.reduce((s,k) => s+(+TARGET_GMV[k].已完成||0), 0);
  const pct = tT > 0 ? tA/tT*100 : 0;
  const deptColor = isSingle ? D_COLOR[depts[0]] : 'var(--blue)';
  cells.push(`<div class="kpi-cell target-cell">
    <div>
      <div class="lbl">当月 GMV 目标达成</div>
      <div class="target-row"><span class="target-label">目标</span><span class="target-val">${fmtAmt(tT)}</span></div>
      <div class="target-row"><span class="target-label">实际</span><span class="target-val" style="color:${deptColor}">${fmtAmt(tA)}</span></div>
      <div class="target-bar-outer"><div class="target-bar-inner" style="width:${Math.min(pct,100).toFixed(1)}%;background:${deptColor}"></div></div>
    </div>
    <div class="qoq" style="text-align:right;font-size:11px;color:${deptColor};font-weight:600">${pct.toFixed(1)}%</div>
  </div>`);
  document.getElementById('kpiRowGMV').innerHTML = cells.join('');
}

function renderKPISpend() {
  const depts = getKpiDepts();
  const isSingle = depts.length === 1;
  const periods = ['今日','近7日','近30日'];
  const labels  = ['今日投入量','近 7 日投入量','近 30 日投入量'];

  const cells = periods.map((p, i) => {
    const tSpend = depts.reduce((s,k) => s+(+SPEND[k][p]||0), 0);
    const tGMV   = depts.reduce((s,k) => s+(+GMV[k][p]||0), 0);
    const roi    = tSpend > 0 ? tGMV/tSpend : 0;
    const yoy    = depts.reduce((s,k) => s+(+SPEND_YOY[k][p]||0), 0) / depts.length;
    return `<div class="kpi-cell">
      <div>
        <div class="lbl">${labels[i]}</div>

      </div>
      <div class="qoq">${qoqHtml(yoy)}</div>
    </div>`;

  const iT = depts.reduce((s,k) => s+(+TARGET_INVEST[k].目标||0), 0);
  const iA = depts.reduce((s,k) => s+(+TARGET_INVEST[k].已完成||0), 0);
  const iPct = iT > 0 ? iA/iT*100 : 0;
  const deptColor = isSingle ? D_COLOR[depts[0]] : 'var(--blue)';
  cells.push(`<div class="kpi-cell target-cell">
    <div>
      <div class="lbl">当月投流成本</div>
      <div class="target-row"><span class="target-label">目标</span><span class="target-val">${fmtAmt(iT)}</span></div>
      <div class="target-row"><span class="target-label">实际</span><span class="target-val" style="color:${deptColor}">${fmtAmt(iA)}</span></div>
      <div class="target-bar-outer"><div class="target-bar-inner" style="width:${Math.min(iPct,100).toFixed(1)}%;background:${deptColor}"></div></div>
    </div>
    <div class="qoq" style="text-align:right;font-size:11px;color:${deptColor};font-weight:600">${iPct.toFixed(1)}%</div>
  </div>`);
  document.getElementById('kpiRowSpend').innerHTML = cells.join('');
}

function renderTrendChart() {
  const RANGE_KEY = {'7':'近7日','30':'近30日','90':'近90日','365':'近365日'};
  const rk = RANGE_KEY[String(trendDays)];
  const mf = METRIC_FMT[trendMetric];
  const base = new Date(REPORT_DATE);
  const labels = [];
  for (let i=trendDays-1; i>=0; i--) {
    const dt = new Date(base); dt.setDate(dt.getDate()-i);
    labels.push(trendDays<=30 ? `${pad(dt.getMonth()+1)}/${pad(dt.getDate())}` :
                trendDays<=90 ? `${dt.getMonth()+1}月${dt.getDate()}日` :
                `${dt.getFullYear()}/${pad(dt.getMonth()+1)}`);
  }
  const depts = trendDept==='all' ? DEPTS : [DEPTS.find(k=>DEPT_KEY[k]===trendDept)||trendDept];
  const datasets = depts.map(k => {
    const raw  = (TREND[k]&&TREND[k][rk]&&TREND[k][rk][mf.dataKey]) || [];
    const data = raw.length>=trendDays ? raw.slice(-trendDays).map(Number) : [...Array(trendDays-raw.length).fill(0),...raw.map(Number)];
    return { label:trendDept==='all' ? (DEPT_LABEL[k] || k) : mf.label, data, borderColor:D_COLOR[k], backgroundColor:D_COLOR[k]+'18', borderDash:D_DASH[k], pointRadius:trendDays>60?0:2, pointHoverRadius:4, tension:.35, fill:false, borderWidth:2 };
  });
  const gc='rgba(0,0,0,0.06)', tc='#a09d97';
  const ctx = document.getElementById('trendChart').getContext('2d');
  if (trendChart) trendChart.destroy();
  trendChart = new Chart(ctx, {
    type:'line', data:{labels,datasets},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{backgroundColor:'#fff',borderColor:'rgba(0,0,0,0.10)',borderWidth:1,titleColor:'#1e1c18',bodyColor:'#6b6760',titleFont:{size:12},bodyFont:{size:12}}},
      scales:{ x:{ticks:{color:tc,font:{size:10},maxTicksLimit:12,maxRotation:0},grid:{color:gc}}, y:{ticks:{color:tc,font:{size:11},callback:v=>mf.yFmt(v)},grid:{color:gc}} } }
  });
  document.getElementById('trendLegend').innerHTML = datasets.map(ds => {
    const hd = ds.borderDash&&ds.borderDash.length;
    const bg = hd ? `repeating-linear-gradient(90deg,${ds.borderColor} 0,${ds.borderColor} 5px,transparent 5px,transparent 8px)` : ds.borderColor;
    return `<span style="display:flex;align-items:center;gap:4px"><span style="width:16px;height:2px;background:${bg};border-radius:2px;display:inline-block"></span><span>${ds.label}</span></span>`;
  }).join('');
}

function renderInflStickyAxis() {
  const axis = document.getElementById('inflYAxis');
  if (!axis || !inflChart || !inflChart.scales || !inflChart.scales.y) return;
  const yScale = inflChart.scales.y;
  const chartArea = inflChart.chartArea;
  axis.innerHTML = '<div class="infl-axis-title">GMV（万）</div>';
  yScale.ticks.forEach(tick => {
    const label = document.createElement('div');
    label.className = 'infl-axis-label';
    label.style.top = `${yScale.getPixelForValue(tick.value)}px`;
    label.textContent = fmtAxisAmt(tick.value);
    axis.appendChild(label);
  });
  const guide = document.createElement('div');
  guide.style.cssText = `position:absolute;right:8px;top:${chartArea.top}px;height:${chartArea.bottom-chartArea.top}px;border-right:1px solid rgba(0,0,0,0.08)`;
  axis.appendChild(guide);
}

function buildInfluencerTrend(days) {
  const raw = TREND_RAW && TREND_RAW['大健康'] ? TREND_RAW['大健康'][`近${days}日GMV`] : null;
  if (Array.isArray(raw) && raw.length) {
    const values = raw.slice(-days);
    const base = new Date(REPORT_DATE);
    return values.map((gmv, idx) => {
      const dt = new Date(base);
      dt.setDate(dt.getDate() - (values.length - 1 - idx));
      return { date:`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`, gmv:+gmv || 0 };
    });
  }
  return (INFLUENCER_CHART && Array.isArray(INFLUENCER_CHART.trend) ? INFLUENCER_CHART.trend : [])
    .filter(item => item && item.date)
    .sort((a,b) => String(a.date).localeCompare(String(b.date)))
    .slice(-days);
}

const inflEventLabelPlugin = {
  id:'inflEventLabelPlugin',
  afterDatasetsDraw(chart) {
    const eventMeta = chart.getDatasetMeta(1);
    if (!eventMeta || !eventMeta.data) return;
    const { ctx } = chart;
    ctx.save();
    ctx.font = '11px PingFang SC, Microsoft YaHei, sans-serif';
    ctx.fillStyle = '#6b6760';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    eventMeta.data.forEach((point, idx) => {
      const raw = chart.data.datasets[1].data[idx];
      if (!raw || raw.y == null || !raw.label) return;
      const lines = String(raw.label).split('\n');
      lines.forEach((line, lineIdx) => {
        ctx.fillText(line, point.x, point.y - 10 - (lines.length - lineIdx - 1) * 12);
      });
    });
    ctx.restore();
  }
};

function renderInflChart() {
  const trend = buildInfluencerTrend(inflDays);
  if (!trend.length) return;

  const dateToGMV = Object.fromEntries(trend.map(item => [item.date, +item.gmv || 0]));
  const labels = trend.map(item => item.date);
  const crossesYear = new Set(labels.map(date => String(date).slice(0,4))).size > 1;
  const gmvData = trend.map(item => +item.gmv || 0);
  const events = (INFLUENCER_CHART && Array.isArray(INFLUENCER_CHART.events) ? INFLUENCER_CHART.events : [])
    .filter(item => item && item.eventDate && Object.prototype.hasOwnProperty.call(dateToGMV, item.eventDate));

  const groupedEvents = events.reduce((acc, item) => {
    const key = item.eventDate;
    if (!acc[key]) acc[key] = [];
    acc[key].push(item);
    return acc;
  }, {});

  const eventData = labels.map(date => {
    const items = groupedEvents[date] || [];
    if (!items.length) return { x:date, y:null, label:'' };
    const labelsText = items.map(item => item.name).join('\n');
    return { x:date, y:dateToGMV[date], label:labelsText, events:items };
  });

  const minWidth = Math.max(900, labels.length * 42 + 140);
  document.getElementById('inflChartInner').style.minWidth = minWidth + 'px';
  const outer = document.getElementById('inflChartOuter');
  requestAnimationFrame(()=>{ outer.scrollLeft = outer.scrollWidth; });

  const ctx = document.getElementById('inflChart').getContext('2d');
  if (inflChart) inflChart.destroy();
  inflChart = new Chart(ctx, {
    type:'line',
    data:{
      labels,
      datasets:[
        {
          label:'达人区 GMV（万）',
          data:gmvData,
          borderColor:'#2f7de1',
          backgroundColor:'rgba(47,125,225,0.08)',
          pointBackgroundColor:'#2f7de1',
          pointBorderColor:'#2f7de1',
          pointRadius:3,
          pointHoverRadius:5,
          tension:0.35,
          fill:true,
          borderWidth:2
        },
        {
          label:'达人事件',
          type:'scatter',
          data:eventData,
          showLine:false,
          pointRadius:ctx => {
            const raw = ctx.raw || {};
            return raw.y == null ? 0 : 6;
          },
          pointHoverRadius:8,
          pointBackgroundColor:ctx => {
            const raw = ctx.raw || {};
            return raw.events && raw.events.length ? D_COLOR['大健康'] : 'transparent';
          },
          pointBorderColor:'#ffffff',
          pointBorderWidth:2
        }
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      layout:{padding:{left:18,right:18}},
      interaction:{mode:'nearest',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#fff',
          borderColor:'rgba(0,0,0,0.10)',
          borderWidth:1,
          titleColor:'#1e1c18',
          bodyColor:'#6b6760',
          callbacks:{
            title:items => items[0] ? `日期：${items[0].label}` : '',
            label:ctx => ctx.datasetIndex===0 ? `GMV：${fmtAmt(ctx.parsed.y)}` : null,
            afterBody:items => {
              const item = items.find(it => it.datasetIndex === 1);
              const raw = item && item.raw;
              if (!raw || !raw.events || !raw.events.length) return [];
              return raw.events.map(ev => ev.name);
            }
          }
        }
      },
      scales:{
        x:{
          offset:true,
          ticks:{
            color:'#a09d97',
            font:{size:10},
            maxRotation:45,
            minRotation:30,
            callback:(value, index) => {
              const date = labels[index] || '';
              if (!date) return '';
              return crossesYear ? `${date.slice(2,4)}/${date.slice(5,7)}/${date.slice(8,10)}` : `${date.slice(5,7)}/${date.slice(8,10)}`;
            }
          },
          grid:{color:'rgba(0,0,0,0.05)'}
        },
        y:{
          ticks:{color:'transparent',font:{size:11},callback:v=>fmtAxisAmt(v)},
          border:{display:false},
          grid:{color:'rgba(0,0,0,0.06)'},
          beginAtZero:true
        }
      }
    },
    plugins:[inflEventLabelPlugin]
  });
  requestAnimationFrame(renderInflStickyAxis);
}

document.getElementById('kpiDeptBtns').addEventListener('click', e => {
  const btn = e.target.closest('.dept-btn'); if (!btn) return;
  document.querySelectorAll('#kpiDeptBtns .dept-btn').forEach(b => b.className='dept-btn');
  const dep = btn.dataset.dept;
  btn.classList.add(dep==='all'?'active-all':`active-${dep.toLowerCase()}`);
  kpiDept = dep; renderKPIGMV(); renderKPISpend();
});

document.getElementById('trendDeptBtns').addEventListener('click', e => {
  const btn = e.target.closest('.dept-btn'); if (!btn) return;
  document.querySelectorAll('#trendDeptBtns .dept-btn').forEach(b => b.className='dept-btn');
  const dep = btn.dataset.dept;
  btn.classList.add(dep==='all'?'active-all':`active-${dep.toLowerCase()}`);
  trendDept=dep; renderTrendChart();
});
document.getElementById('trendRangeSelect').addEventListener('change', e => { trendDays=parseInt(e.target.value); renderTrendChart(); });
document.querySelectorAll('#trendMetricBtns .t-btn').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('#trendMetricBtns .t-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); trendMetric=btn.dataset.metric; renderTrendChart();
}));
document.querySelectorAll('#inflRangeBtns .t-btn').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('#inflRangeBtns .t-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); inflDays=parseInt(btn.dataset.days); renderInflChart();
}));

renderKPIGMV(); renderKPISpend(); renderTrendChart(); renderInflChart();
window.addEventListener('resize', () => requestAnimationFrame(renderInflStickyAxis));
</script>
</body>
